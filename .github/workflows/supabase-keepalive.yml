name: Supabase keep-alive

on:
  # Mon/Wed/Fri at 03:17 UTC. More than one request per week provides a buffer
  # for delayed or failed scheduled workflow runs.
  schedule:
    - cron: '17 3 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret not configured. Skipping keep-alive query."
            exit 0
          fi
          node scripts/supabase-keepalive.mjs
